<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" /> <!-- violet-600 -->
      <stop offset="50%" stop-color="#8b5cf6" /> <!-- violet-500 -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- cyan-500 -->
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M380 120 c 0,20 20,40 40,40 c -20,0 -40,20 -40,40 c 0,-20 -20,-40 -40,-40 c 20,0 40,-20 40,-40 Z" />
    <path d="M130 380 c 0,10 10,20 20,20 c -10,0 -20,10 -20,20 c 0,-10 -10,-20 -20,-20 c 10,0 20,-10 20,-20 Z" />
    <path d="M420 350 c 0,7 7,14 14,14 c -7,0 -14,7 -14,14 c 0,-7 -7,-14 -14,-14 c 7,0 14,-7 14,-14 Z" opacity="0.7"/>
  </g>

  <!-- AB Text -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="240" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-15" filter="url(#shadow)">AB</text>
</svg>